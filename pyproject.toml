[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "enterprise-mdm-ics-gatekeeper"
version = "0.1.0"
description = "Deterministic Master Data Management (GS1/GDSN) and Finance Pre-Close (ICS/SOX) validation engine with DuckDB audit lineage, four-eyes workflows and optional AWS Bedrock remediation."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Ernesto Wendling", email = "tech@ernestowendling.ch" }]
maintainers = [{ name = "Ernesto Wendling", email = "tech@ernestowendling.ch" }]
keywords = [
    "data-governance",
    "master-data-management",
    "internal-controls",
    "sox",
    "bcbs-239",
    "gs1",
    "gdsn",
    "duckdb",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Accounting",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.7",
    "duckdb>=1.0",
    "pyyaml>=6.0",
    "fastapi>=0.111",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
ui = ["streamlit>=1.36"]
aws = ["boto3>=1.34"]
dev = [
    "pytest>=8.2",
    "httpx>=0.27",
    "ruff==0.16.9",
    "mypy>=1.10",
    "types-PyYAML>=6.0",
]

[project.urls]
Repository = "https://github.com/ernestowendling/enterprise-mdm-ics-gatekeeper"

[tool.hatch.build.targets.wheel]
packages = ["src/gatekeeper"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N", "C4", "PT", "RET"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.isort]
known-first-party = ["gatekeeper"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["duckdb", "duckdb.*", "boto3", "boto3.*", "botocore", "botocore.*", "yaml", "streamlit", "streamlit.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
